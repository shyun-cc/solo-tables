title: solo-tables · 设计讨论稿
baseURL: https://shyun-cc.github.io/solo-tables/
defaultContentLanguage: zh
enableRobotsTXT: true
timeZone: UTC
languages:
  zh:
    label: 简体中文
    locale: zh-CN
    hasCJKLanguage: true
    params:
      description: 文档先行的设计讨论稿；业务需求待确认，尚未实现。
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]
params:
  offline_search: true
  copyright:
    authors: solo-tables contributors
    from_year: 2026
  footer_center_info: 设计讨论稿 · 尚未实现
  ui:
    preset: paper
    dark_mode: true
    section_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0
