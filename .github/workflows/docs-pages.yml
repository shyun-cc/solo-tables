name: Documentation and Pages

on:
  pull_request:
    paths: ['docs/**', '.github/workflows/docs-pages.yml', '.gitignore']
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/docs-pages.yml', '.gitignore']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27.3'
  HUGO_VERSION: '0.168.0'
  GOWORK: 'off'
  HUGO_MODULE_WORKSPACE: 'off'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: docs/go.sum
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true
      - name: Record tool versions
        run: |
          go version
          hugo version
      - name: Verify pinned module
        run: |
          go mod download github.com/pgsty/oink
          go mod verify
      - name: Build documentation
        run: >-
          hugo --cleanDestinationDir --gc --minify --environment production
          --printPathWarnings
      - name: Upload Pages artifact from main only
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check existing Pages configuration
        uses: actions/configure-pages@v6
        with:
          enablement: false
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v5
